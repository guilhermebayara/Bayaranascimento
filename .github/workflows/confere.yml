# O GitHub roda só a gestalt, e só no PR para a main e por disparo manual (aba Actions, "Run workflow").
# A guarda da produção e os testes já rodam no build do Cloudflare (npm run build chama o prebuild) em
# todo push: se falharem, nada é publicado e a versão anterior continua no ar. O GitHub não repete esse
# trabalho. Nos PRs para a homologa, a gestalt é a que a sessão roda na própria máquina antes de cada push.
# O motivo: o repositório vira privado depois de 10/12/2026, e no plano gratuito a cota mensal de Actions
# é uma só para todos os repositórios privados da conta, sem proteção de branch. A estimativa era de 800 a
# 1.300 minutos por mês antes e de 50 a 70 depois (decisão do Gui, 20/11/2026).
# Mudança só de documento não dispara nada. Ver CLAUDE.md, "Conferências".
name: Confere o site

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Um push novo no mesmo PR, ou um novo disparo manual na mesma branch, cancela a rodada anterior
concurrency:
  group: confere-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A gestalt que se confere sozinha (npm run gestalt, ver CLAUDE.md, "Conferências"). Precisa do
  # servidor local com o acervo de exemplo e de um navegador, que o build do Cloudflare não tem: por
  # isso roda aqui, num trabalho à parte. Não usa segredo nenhum: o servidor local não fala com o
  # Cloudflare (remoteBindings: false em astro.config.mjs) e o banco e as fotos são os locais.
  gestalt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O Playwright entra só aqui, fora das dependências do site
      # (a versão fica numa variável: "nome@versão" parece e-mail para a guarda da produção)
      - name: Navegador da conferência
        env:
          VERSAO_DO_PLAYWRIGHT: 1.63.0
        run: |
          npm install --no-save "playwright@${VERSAO_DO_PLAYWRIGHT}"
          npx playwright install --with-deps chromium
      - name: Servidor local com o acervo de exemplo
        run: |
          npx astro dev --port 4321 --background
          # O servidor atende em "localhost", que no GitHub pode ser só IPv6: 127.0.0.1 nunca respondia.
          # Qualquer resposta HTTP basta para saber que subiu; se não subir, o log ajuda a entender
          timeout 180 sh -c 'until curl -s -o /dev/null http://localhost:4321/; do sleep 2; done' || { npx astro dev logs; exit 1; }
          curl -s -o /dev/null -w 'Primeira resposta: %{http_code}\n' http://localhost:4321/
          npm run fotos-de-exemplo -- http://localhost:4321
      - name: Gestalt em 390 e 1280 px
        run: npm run gestalt
